<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
                <span class="logo-icon">🏠</span> 
                <span class="logo-text">PrimeProp</span>
            </a>
        </div>
        
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="landing.html">Landing</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>

        <button id="theme-toggle" class="theme-btn">Light Mode</button>

        <div class="burger" id="burger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
    </header>

    <main class="contact-container">
        <div class="page-header">
            <h1>Get In Touch</h1>
            <p>Have questions? We are here to help you find your dream property.</p>
        </div>

        <div class="contact-content">
            <div class="contact-form-wrapper">
                <form id="contactForm">
                    <div class="input-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Your Name" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Your Email" required>
                    </div>

                    <div class="input-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="How can we help?" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">SEND MESSAGE</button>
                </form>
            </div>

            <div class="contact-info-wrapper">
                <div class="info-card">
                    <h3>Address</h3>
                    <p>Astana<br>Astana University</p>
                </div>

                <div class="info-card">
                    <h3>Phone</h3>
                    <p>+7 705 289 88844</p>
                </div>

                <div class="info-card">
                    <h3>Email</h3>
                    <p>tuegalimeirzhan@gmail.com</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>2025 PrimeProp.</p>
    </footer>

    <script src="js/contact.js"></script>
</body>
</html>
